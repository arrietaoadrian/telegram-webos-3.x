<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram TV — Web</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Arial, sans-serif; background:#0e1116; color:#eee; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#15181f; flex-wrap:wrap; }
  header h1 { font-size:20px; color:#2aabee; white-space:nowrap; }
  header input { padding:8px 10px; border-radius:6px; border:1px solid #333; background:#1a1d24; color:#fff; font-size:14px; }
  #url { flex:1; min-width:240px; }
  #q { width:220px; }
  button { padding:8px 14px; border:0; border-radius:6px; background:#2aabee; color:#fff; cursor:pointer; font-size:14px; }
  button.ghost { background:#2a2f3a; }
  #content { padding:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
  .card { background:#15181f; border-radius:8px; overflow:hidden; cursor:pointer; transition: transform .1s; }
  .card:hover { transform: scale(1.03); }
  .card img { width:100%; height:220px; object-fit:cover; background:#1b232b; display:block; }
  .card .t { padding:8px 10px; font-size:13px; line-height:1.3; min-height:34px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card .m { padding:0 10px 8px; font-size:11px; color:#999; }
  .chat { display:flex; align-items:center; gap:12px; padding:10px 12px; background:#15181f; border-radius:8px; margin-bottom:8px; cursor:pointer; }
  .chat:hover { background:#1e232d; }
  .chat img { width:44px; height:44px; border-radius:50%; object-fit:cover; background:#2aabee; }
  .chat .n { font-size:15px; }
  .chat .s { font-size:12px; color:#999; }
  .back { display:inline-block; margin-bottom:12px; cursor:pointer; color:#2aabee; }
  .empty { color:#999; padding:30px 0; text-align:center; }
  .overlay { position:fixed; inset:0; background:#000; display:none; z-index:50; }
  .overlay.show { display:flex; align-items:center; justify-content:center; }
  .overlay video, .overlay img { max-width:100%; max-height:100%; }
  .overlay .close { position:absolute; top:12px; left:12px; }
  .hint { color:#888; font-size:12px; padding:0 16px 4px; }
  #status { color:#7f9; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Telegram TV</h1>
  <input id="url" placeholder="http://192.168.40.44:8080" title="Dirección del servidor">
  <button onclick="connect()">Conectar</button>
  <input id="q" placeholder="Buscar...">
  <button onclick="doSearch()">Buscar</button>
  <button class="ghost" onclick="loadChannels()">Canales</button>
  <span id="status"></span>
</header>
<div class="hint" id="hint"></div>
<div id="content"></div>

<div class="overlay" id="player">
  <button class="close" onclick="closeOverlay()">✕ Cerrar</button>
  <video id="v" controls></video>
</div>
<div class="overlay" id="photoview">
  <button class="close" onclick="closeOverlay()">✕ Cerrar</button>
  <img id="pimg" src="" alt="">
</div>

<script>
let BACKEND = localStorage.getItem('tg_web_url') || 'http://192.168.40.44:8080';
let curChat = null, curClass = null, curTitle = '';
let media = [];

document.getElementById('url').value = BACKEND;

async function api(path) {
  const r = await fetch(BACKEND + path);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function connect() {
  BACKEND = document.getElementById('url').value.trim().replace(/\/+$/, '');
  localStorage.setItem('tg_web_url', BACKEND);
  loadChannels();
}

async function loadChannels() {
  curChat = null;
  document.getElementById('hint').textContent = '';
  const c = document.getElementById('content');
  c.innerHTML = '<div class="empty">Cargando...</div>';
  try {
    const data = await api('/api/dialogs');
    const list = data.dialogs || [];
    let html = '<div class="back" onclick="loadArchived()">📁 Archivados (' + (data.archived ? data.archived.length : 0) + ')</div>';
    if (!list.length) html += '<div class="empty">No hay canales.</div>';
    html += '<div class="grid">';
    for (const d of list) {
      html += `<div class="chat" onclick="openChat('${d.id}','${d.className}','${escapeHtml(d.title)}')">
        <img src="${BACKEND}/api/avatar?chat=${d.id}&className=${d.className}" onerror="this.style.visibility='hidden'">
        <div><div class="n">${escapeHtml(d.title || d.username || d.id)}</div><div class="s">${d.saved ? 'Mensajes guardados' : (d.username ? '@' + d.username : 'Canal')}</div></div>
      </div>`;
    }
    html += '</div>';
    c.innerHTML = html;
  } catch (e) { c.innerHTML = '<div class="empty">Error: ' + e.message + '</div>'; }
}

async function loadArchived() {
  curChat = null;
  document.getElementById('hint').textContent = '';
  const c = document.getElementById('content');
  c.innerHTML = '<div class="empty">Cargando...</div>';
  try {
    const data = await api('/api/dialogs');
    const list = data.archived || [];
    let html = '<div class="back" onclick="loadChannels()">← Volver a canales</div>';
    if (!list.length) html += '<div class="empty">No hay archivados.</div>';
    html += '<div class="grid">';
    for (const d of list) {
      html += `<div class="chat" onclick="openChat('${d.id}','${d.className}','${escapeHtml(d.title)}')">
        <img src="${BACKEND}/api/avatar?chat=${d.id}&className=${d.className}" onerror="this.style.visibility='hidden'">
        <div><div class="n">${escapeHtml(d.title || d.username || d.id)}</div><div class="s">${d.username ? '@' + d.username : 'Canal'}</div></div>
      </div>`;
    }
    html += '</div>';
    c.innerHTML = html;
  } catch (e) { c.innerHTML = '<div class="empty">Error: ' + e.message + '</div>'; }
}

async function openChat(id, cls, title) {
  curChat = id; curClass = cls; curTitle = title;
  document.getElementById('hint').textContent = '';
  const c = document.getElementById('content');
  c.innerHTML = '<div class="empty">Cargando...</div>';
  try {
    const data = await api('/api/messages?chat=' + id + '&className=' + cls);
    media = data.messages || [];
    renderMedia(title);
  } catch (e) { c.innerHTML = '<div class="empty">Error: ' + e.message + '</div>'; }
}

function renderMedia(title) {
  const c = document.getElementById('content');
  let html = `<div class="back" onclick="loadChannels()">← Canales</div><h2 style="margin:0 0 12px;font-size:18px;">${escapeHtml(title || '')}</h2>`;
  if (!media.length) html += '<div class="empty">No hay medios.</div>';
  html += '<div class="grid">';
  for (const v of media) {
    const thumb = `${BACKEND}/api/thumb?chat=${curChat}&className=${curClass}&msgId=${v.id}`;
    const cap = (v.caption || '').replace(/\s+/g, ' ').slice(0, 80);
    const date = fmtDate(v.date);
    if (v.type === 'photo') {
      html += `<div class="card" onclick="showPhoto('${v.id}')"><img src="${thumb}" loading="lazy"><div class="t">${escapeHtml(cap || 'Foto')}</div><div class="m">${date}</div></div>`;
    } else if (v.type === 'audio') {
      html += `<div class="card" onclick="play('${v.id}','audio')"><div style="height:220px;background:#1b232b;display:flex;align-items:center;justify-content:center;font-size:40px;">♪</div><div class="t">${escapeHtml(cap || 'Canción')}</div><div class="m">${date}</div></div>`;
    } else {
      const isMkv = v.type === 'video_file';
      html += `<div class="card" onclick="play('${v.id}','video')"><img src="${thumb}" loading="lazy" onerror="this.style.opacity='.2'"><div class="t">${escapeHtml(cap || 'Video')}</div><div class="m">${isMkv ? 'MKV · ' : ''}${fmtDur(v.duration)} · ${date}</div></div>`;
    }
  }
  html += '</div>';
  c.innerHTML = html;
}

function play(msgId, type) {
  const url = type === 'audio'
    ? `${BACKEND}/api/audio?chat=${curChat}&className=${curClass}&msgId=${msgId}`
    : `${BACKEND}/api/video?chat=${curChat}&className=${curClass}&msgId=${msgId}`;
  const v = document.getElementById('v');
  v.src = url;
  v.play();
  document.getElementById('player').classList.add('show');
}

function showPhoto(msgId) {
  document.getElementById('pimg').src = `${BACKEND}/api/photo?chat=${curChat}&className=${curClass}&msgId=${msgId}`;
  document.getElementById('photoview').classList.add('show');
}

function closeOverlay() {
  document.getElementById('player').classList.remove('show');
  document.getElementById('photoview').classList.remove('show');
  document.getElementById('v').pause();
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const c = document.getElementById('content');
  c.innerHTML = '<div class="empty">Buscando...</div>';
  try {
    if (curChat) {
      const data = await api('/api/search?chat=' + curChat + '&className=' + curClass + '&q=' + encodeURIComponent(q));
      media = data.messages || [];
      renderMedia('Resultados: ' + q);
    } else {
      const data = await api('/api/searchGlobal?q=' + encodeURIComponent(q));
      media = (data.messages || []).map(m => { m.chatTitle = m.chatTitle; return m; });
      const c2 = document.getElementById('content');
      let html = `<div class="back" onclick="loadChannels()">← Canales</div><h2 style="margin:0 0 12px;font-size:18px;">Resultados: ${escapeHtml(q)}</h2>`;
      if (!media.length) html += '<div class="empty">Sin resultados.</div>';
      html += '<div class="grid">';
      for (const v of media) {
        const thumb = `${BACKEND}/api/thumb?chat=${v.chatId}&className=${v.className}&msgId=${v.id}`;
        html += `<div class="card" onclick="openFromSearch('${v.chatId}','${v.className}','${escapeHtml(v.chatTitle)}','${v.id}')"><img src="${thumb}" loading="lazy" onerror="this.style.opacity='.2'"><div class="t">${escapeHtml(v.caption || 'Video')}</div><div class="m">${escapeHtml(v.chatTitle)}</div></div>`;
      }
      html += '</div>';
      c2.innerHTML = html;
    }
  } catch (e) { c.innerHTML = '<div class="empty">Error: ' + e.message + '</div>'; }
}

async function openFromSearch(chatId, cls, title, msgId) {
  curChat = chatId; curClass = cls; curTitle = title;
  const data = await api('/api/messages?chat=' + chatId + '&className=' + cls);
  media = data.messages || [];
  renderMedia(title);
}

function fmtDur(s) {
  s = Math.floor(s || 0);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${m}:${String(ss).padStart(2,'0')}`;
}
function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts*1000);
  if (isNaN(d)) return '';
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ' · ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Verificar conexión al cargar
(async () => {
  try {
    const st = await api('/api/status');
    document.getElementById('status').textContent = st.loggedIn ? '✓ Conectado' : 'Sesión no iniciada';
    if (st.loggedIn) loadChannels();
    else document.getElementById('content').innerHTML = '<div class="empty">El servidor no tiene sesión iniciada. Ábrelo en Termux y escanea el QR con la app del TV.</div>';
  } catch (e) {
    document.getElementById('status').textContent = 'Sin conexión';
    document.getElementById('content').innerHTML = '<div class="empty">No se pudo conectar a ' + BACKEND + '. Verifica la dirección y que el servidor esté corriendo.</div>';
  }
})();
</script>
</body>
</html>
